name: Inspect legacy RoundUp program runtime
on:
  push:
    paths:
      - .github/workflows/inspect-legacy.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect package and serve original UI
        shell: pwsh
        run: |
          $inputArchive = 'legacy/GeoZamir_5.5_GUI_Launcher_Windows.zip'
          $root = Join-Path $env:RUNNER_TEMP 'legacy-roundup-inspection'
          Expand-Archive -Path $inputArchive -DestinationPath $root -Force
          $programs = @(Get-ChildItem $root -File -Recurse -Filter 'GeoZamir.exe')
          if ($programs.Count -ne 1) { throw "Expected one GeoZamir.exe; got $($programs.Count)" }
          $app = $programs[0]
          Write-Host "Legacy app size: $($app.Length)"
          Write-Host "Legacy app path: $($app.FullName)"
          New-Item -ItemType Directory -Force -Path 'legacy/extracted_runtime' | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP 'roundup-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'roundup-stderr.txt'
          $proc = Start-Process -FilePath $app.FullName -WorkingDirectory $app.DirectoryName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 10
            $proc.Refresh()
            Write-Host "Program is running: $(!$proc.HasExited)"
            if (Test-Path $stdout) {
              $log = (Get-Content -Path $stdout -Raw -ErrorAction SilentlyContinue)
              Write-Host "Stdout excerpt: $($log.Substring(0,[Math]::Min(1200,$log.Length)))"
            }
            if (Test-Path $stderr) {
              $log = (Get-Content -Path $stderr -Raw -ErrorAction SilentlyContinue)
              Write-Host "Stderr excerpt: $($log.Substring(0,[Math]::Min(1200,$log.Length)))"
            }
            $childProcesses = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $proc.Id } | Select-Object -ExpandProperty ProcessId)
            $ownedIds = @($proc.Id) + $childProcesses
            $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.OwningProcess -in $ownedIds -and $_.LocalPort -gt 1000 })
            Write-Host "Listening ports: $($listeners.LocalPort -join ',')"
            foreach ($entry in $listeners) {
              $uri = "http://127.0.0.1:$($entry.LocalPort)/"
              try {
                $response = Invoke-WebRequest -Uri $uri -TimeoutSec 5 -UseBasicParsing
                Write-Host "Candidate HTTP: $uri status $($response.StatusCode) bytes $($response.RawContentLength)"
                if ($response.Content.Length -gt 1000 -and $response.Content -match '(?i)<html|<!doctype') {
                  $output = 'legacy/extracted_runtime/index.html'
                  [System.IO.File]::WriteAllText((Join-Path (Get-Location) $output), $response.Content, [System.Text.Encoding]::UTF8)
                  Write-Host "Recovered original UI HTML: $($response.Content.Length) characters"
                  break
                }
              } catch {
                Write-Host "Port $($entry.LocalPort) does not serve HTML: $($_.Exception.Message)"
              }
            }
          }
          finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          if (!(Test-Path 'legacy/extracted_runtime/index.html')) {
            Write-Host 'No HTTP UI recovered in this environment.'
          }
      - name: Upload extracted runtime for review
        uses: actions/upload-artifact@v4
        with:
          name: GeoZamir-runtime-inspection
          path: legacy/extracted_runtime/
          if-no-files-found: ignore
      - name: Commit recovered HTML
        shell: pwsh
        run: |
          if (!(Test-Path 'legacy/extracted_runtime/index.html')) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy/extracted_runtime/index.html
          git commit -m 'Recover GeoZamir frontend HTML for RoundUp UI migration'
          if ($LASTEXITCODE -ne 0) { exit 0 }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit recovered frontend' }
