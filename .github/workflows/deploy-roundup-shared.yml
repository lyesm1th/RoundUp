name: Deploy RoundUp shared API (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shared-workspace-phase1
      - main
    paths:
      - "cloudflare/src/worker.mjs"
      - "cloudflare/schema.sql"
      - "cloudflare/prepare-deployment.mjs"
      - "cloudflare/wrangler.jsonc.example"
      - "cloudflare/package.json"
      - ".github/workflows/deploy-roundup-shared.yml"

permissions:
  contents: read

concurrency:
  group: roundup-shared-api-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate API code and SQL before touching Cloudflare
        run: |
          node --check src/worker.mjs
          node --test tests/worker.test.mjs
          python3 -c "import sqlite3; sqlite3.connect(':memory:').executescript(open('schema.sql', encoding='utf-8').read())"

      - name: Install Wrangler (no deployment secrets exposed)
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Create or reuse dedicated RoundUp D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node prepare-deployment.mjs

      - name: Install additive D1 schema (no deletes or drops)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute roundup-shared --remote --file=./schema.sql

      - name: Deploy separate RoundUp Worker (no existing desktop update)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set initial director setup secret on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUNDUP_SETUP_SECRET: ${{ secrets.ROUNDUP_SETUP_SECRET }}
        run: |
          if [ "${#ROUNDUP_SETUP_SECRET}" -lt 32 ]; then
            echo "ROUNDUP_SETUP_SECRET must be at least 32 characters" >&2
            exit 1
          fi
          printf '%s' "$ROUNDUP_SETUP_SECRET" | npx wrangler secret put ROUNDUP_SETUP_SECRET

      - name: Report successful deployment
        run: |
          echo "### RoundUp API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: roundup-workspace-api" >> "$GITHUB_STEP_SUMMARY"
          echo "D1: roundup-shared" >> "$GITHUB_STEP_SUMMARY"
          echo "The desktop client is not yet connected. No ZIP archives or desktop data were modified." >> "$GITHUB_STEP_SUMMARY"
