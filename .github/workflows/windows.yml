name: Build and publish RoundUp Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and icon
        shell: pwsh
        run: |
          node --check src/RoundUp.UI/app.js
          if ($LASTEXITCODE -ne 0) { throw "app.js invalid" }
          node --check src/RoundUp.UI/roundup-addon.js
          if ($LASTEXITCODE -ne 0) { throw "roundup-addon.js invalid" }
          node scripts/test_roundup_parser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Import GPS and comments regression" }
          if (Select-String -Path src/RoundUp.App/Program.cs -Pattern 'OpenBrowser\(|ProxyAsync|WebApplication|ConfigureKestrel') { throw "RoundUp must have no browser launcher or HTTP proxy" }
          if (Select-String -Path src/RoundUp.App/RoundUpWindow.cs -Pattern 'ToolStripButton|new ToolStrip|Controls.Add\(toolbar\)') { throw "RoundUp must not overlay a second header on the web UI" }
          python scripts/build_icon.py
          if (!(Test-Path assets/RoundUp.ico)) { throw "RoundUp icon missing" }
      - name: Build RoundUp desktop host and bundle real core
        shell: pwsh
        run: |
          dotnet publish src/RoundUp.App/RoundUp.App.csproj -c Release -r win-x64 -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "RoundUp App compilation failed" }
          Copy-Item src/RoundUp.UI dist/app/ui -Recurse -Force
          New-Item -ItemType Directory -Force dist/app/ui/vendor | Out-Null
          Copy-Item legacy/extracted_runtime/vendor/jszip.min.js dist/app/ui/vendor/jszip.min.js
          $legacyDir = Join-Path $env:RUNNER_TEMP 'roundup-legacy'
          Expand-Archive legacy/GeoZamir_5.5_GUI_Launcher_Windows.zip $legacyDir -Force
          $cores = @(Get-ChildItem $legacyDir -Recurse -File -Filter 'GeoZamir.exe')
          if ($cores.Count -ne 1) { throw "Legacy core count is $($cores.Count)" }
          Copy-Item $cores[0].FullName dist/app/GeoZamirCore.exe
          if (!(Test-Path dist/app/RoundUp.exe)) { throw "RoundUp.exe missing" }
      - name: Smoke-test unmodified GeoZamir directly from RoundUp Windows window
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/app/RoundUp.exe).Path
          $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/roundup-host.log'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          try {
            $ready = $false
            for($i=0;$i -lt 180;$i++){
              Start-Sleep -Milliseconds 450
              $p.Refresh()
              if($p.HasExited){throw "RoundUp exited during native startup: $($p.ExitCode)"}
              if(Test-Path $log){
                $content = Get-Content $log -Raw
                if($content -match 'direct-core-ui-ready:' -and $content -match 'direct-core-ui-override:'){
                  $ready = $true
                  break
                }
              }
            }
            if(!$ready){
              if(Test-Path $log){Get-Content $log -Tail 150}
              throw "RoundUp did not display the redesigned UI directly from GeoZamir"
            }
            if($p.MainWindowTitle -notmatch 'RoundUp'){throw "Windows native RoundUp window not visible"}
            $match = [regex]::Matches($content,'Original interpreter connected on port (\d+)') | Select-Object -Last 1
            if(!$match){throw "Could not determine the original backend port"}
            $port = $match.Groups[1].Value
            $originalUri = "http://127.0.0.1:$port/"
            $originalHtml = (Invoke-WebRequest $originalUri -UseBasicParsing).Content
            if($originalHtml -notmatch 'GEOZAMIR_TOKEN'){throw "Original unmodified Go server is not serving HTML"}
            $tokenMatch = [regex]::Match($originalHtml,'window\.GEOZAMIR_TOKEN="([^"]+)"')
            if(!$tokenMatch.Success){throw "Original token not found in Go backend HTML"}
            $token = $tokenMatch.Groups[1].Value
            $probeDir = Join-Path $env:RUNNER_TEMP 'roundup-direct-probe'
            New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
            $json = '{"objects":[{"object":"RoundUp upload smoke","geo":{"lat":49.84,"lng":24.03},"comment":"GPS + comment"}]}'
            Set-Content -Path (Join-Path $probeDir 'дані.json') -Value $json -Encoding utf8
            [IO.File]::WriteAllBytes((Join-Path $probeDir 'photo-data.dat'),[Security.Cryptography.RandomNumberGenerator]::GetBytes(1600000))
            $probeZip = Join-Path $env:RUNNER_TEMP 'roundup-direct-probe.zip'
            Compress-Archive -Path (Join-Path $probeDir '*') -DestinationPath $probeZip -Force
            for($i=1;$i -le 4;$i++){
              $headers = @{
                'X-GeoZamir-Token' = $token
                'X-GeoZamir-Project' = 'default'
                'X-File-Name' = "roundup-direct-smoke-$i.zip"
              }
              $result = Invoke-RestMethod -Uri ($originalUri + 'api/import') -Method Post -Headers $headers -ContentType 'application/zip' -InFile $probeZip -TimeoutSec 45
              if(!$result.item.id -and !$result.duplicate){throw "Core import response missing item"}
              Write-Host "PASS: original untouched GeoZamir ZIP API $i/4"
            }
            $p.Refresh()
            if($p.HasExited){throw "RoundUp exited while original core handled ZIP imports"}
            Write-Host "PASS: branded RoundUp WebView2 + unmodified original GeoZamir without intermediary or API proxy."
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            if(!$ready -and (Test-Path $log)){Get-Content $log -Tail 150}
          }
      - name: Verify native window stays open when legacy core is absent
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist/app/GeoZamirCore.exe).Path
          $disabled = "$bundle.startup-test-disabled"
          Move-Item $bundle $disabled
          $exe = (Resolve-Path dist/app/RoundUp.exe).Path
          $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/roundup-host.log'
          $before = if(Test-Path $log){(Get-Content $log -Raw).Length}else{0}
          $p = $null
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
            $ready = $false
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 350
              $p.Refresh()
              if($p.HasExited){throw "Missing backend crashed RoundUp"}
              $all = if(Test-Path $log){Get-Content $log -Raw}else{''}
              $new = if($all.Length -gt $before){$all.Substring($before)}else{''}
              if($new -match 'native-window-shown' -and $new -match 'CORE STARTUP:'){$ready=$true;break}
            }
            if(!$ready){throw "Missing backend did not show a diagnostic native window"}
            Write-Host "PASS: native window remains open and displays backend error."
          } finally {
            if($p -and !$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Move-Item $disabled $bundle -Force
          }
      - name: Compile and smoke-test launcher UI
        shell: pwsh
        run: |
          dotnet publish src/RoundUp.Launcher/RoundUp.Launcher.csproj -c Release -r win-x64 -o dist/launcher
          if ($LASTEXITCODE -ne 0) { throw "Launcher compilation failed" }
          $p = Start-Process -FilePath (Resolve-Path dist/launcher/RoundUpLauncher.exe).Path -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/launcher.log'
          $shown = $false
          try {
            for($i=0;$i -lt 25;$i++){
              Start-Sleep -Seconds 1
              if((Test-Path $log) -and ((Get-Content $log -Raw) -match 'ui-shown')){$shown=$true;break}
              if($p.HasExited){break}
            }
            if(!$shown){throw "Launcher UI did not open"}
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Compile one-click installer and smoke-test directories
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup unavailable" }
          }
          & $iscc '/DAppVersion=6.2.0' 'installer/RoundUp.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno installer failed" }
          $setup = (Resolve-Path dist/setup/RoundUpSetup-win-x64.exe).Path
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer exit code $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'RoundUp'
          foreach ($item in @('RoundUpLauncher.exe','app','projects','photos','imports','updates','backups/app','backups/projects','logs')) {
            if (!(Test-Path (Join-Path $root $item))) { throw "Missing installer folder $item" }
          }
      - name: Archive tested RoundUp release and compute update integrity hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/app/* -DestinationPath release/RoundUp-App-win-x64.zip -CompressionLevel Optimal
          $hash=(Get-FileHash release/RoundUp-App-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            version='v6.2.0'
            archive='RoundUp-App-win-x64.zip'
            executable='RoundUp.exe'
            sha256=$hash
          } | ConvertTo-Json | Set-Content release/roundup-update.json -Encoding utf8
          Copy-Item dist/launcher/RoundUpLauncher.exe release/RoundUpLauncher.exe
          Copy-Item dist/setup/RoundUpSetup-win-x64.exe release/RoundUpSetup-win-x64.exe
      - name: Upload Windows installer and program
        uses: actions/upload-artifact@v4
        with:
          name: RoundUp-Installer-and-App-win-x64
          path: release/
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub Release for launcher auto-updates
        if: contains(github.event.head_commit.message, '[publish]') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v6.2.0'
          $published = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            gh release view $tag --json tagName *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag release/RoundUp-App-win-x64.zip release/roundup-update.json release/RoundUpLauncher.exe release/RoundUpSetup-win-x64.exe --clobber
            } else {
              gh release create $tag release/RoundUp-App-win-x64.zip release/roundup-update.json release/RoundUpLauncher.exe release/RoundUpSetup-win-x64.exe --title 'RoundUp 6.2.0 — Windows' --notes 'GeoZamir 5.5 використовується напряму: RoundUp вбудовує лише оновлену графіку в WebView2. Повністю прибрано проміжний HTTP-сервер і проксі; ZIP, GPS, фото, архіви та проєкти обробляє оригінальне ядро.' --target $env:GITHUB_SHA
            }
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            Write-Warning "Transient GitHub release API failure; attempt $attempt of 6"
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (!$published) { throw "GitHub Release publishing failed after 6 attempts" }
