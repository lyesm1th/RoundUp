name: Build and publish RoundUp Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and icon
        shell: pwsh
        run: |
          node --check src/RoundUp.UI/app.js
          if ($LASTEXITCODE -ne 0) { throw "app.js invalid" }
          node --check src/RoundUp.UI/roundup-addon.js
          if ($LASTEXITCODE -ne 0) { throw "roundup-addon.js invalid" }
          node scripts/test_roundup_parser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Import GPS and comments regression" }
          if (Select-String -Path src/RoundUp.App/Program.cs -Pattern 'OpenBrowser\(') { throw "Main RoundUp must never launch Chrome" }
          if (Select-String -Path src/RoundUp.App/RoundUpWindow.cs -Pattern 'ToolStripButton|new ToolStrip|Controls.Add\(toolbar\)') { throw "RoundUp must not overlay a second header on the web UI" }
          python scripts/build_icon.py
          if (!(Test-Path assets/RoundUp.ico)) { throw "RoundUp icon missing" }
      - name: Build RoundUp desktop host and bundle real core
        shell: pwsh
        run: |
          dotnet publish src/RoundUp.App/RoundUp.App.csproj -c Release -r win-x64 -o dist/app
          if ($LASTEXITCODE -ne 0) { throw "RoundUp App compilation failed" }
          Copy-Item src/RoundUp.UI dist/app/ui -Recurse -Force
          New-Item -ItemType Directory -Force dist/app/ui/vendor | Out-Null
          Copy-Item legacy/extracted_runtime/vendor/jszip.min.js dist/app/ui/vendor/jszip.min.js
          $legacyDir = Join-Path $env:RUNNER_TEMP 'roundup-legacy'
          Expand-Archive legacy/GeoZamir_5.5_GUI_Launcher_Windows.zip $legacyDir -Force
          $cores = @(Get-ChildItem $legacyDir -Recurse -File -Filter 'GeoZamir.exe')
          if ($cores.Count -ne 1) { throw "Legacy core count is $($cores.Count)" }
          Copy-Item $cores[0].FullName dist/app/GeoZamirCore.exe
          if (!(Test-Path dist/app/RoundUp.exe)) { throw "RoundUp.exe missing" }
      - name: Functional smoke of local host, legacy parser and coverage
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/app/RoundUp.exe).Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          $ready = $false
          try {
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 750
              $p.Refresh()
              if ($p.HasExited) { throw "RoundUp exited: $($p.ExitCode)" }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:45672/roundup/status' -TimeoutSec 1
                if ($status.ready) { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw "RoundUp host did not start" }
            $nativeLog = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/roundup-host.log'
            $nativeShown = $false
            for($j=0; $j -lt 135; $j++){
              Start-Sleep -Milliseconds 450
              $p.Refresh()
              $contents = if(Test-Path $nativeLog){ Get-Content $nativeLog -Raw }else{ '' }
              if($contents -match 'native-window-shown' -and $contents -match 'webview-ready') {
                $nativeShown = $true
                break
              }
              if($p.HasExited){ throw "Native RoundUp window crashed" }
            }
            if(!$nativeShown){
              Write-Host "Native UI initialization timeout — last diagnostic lines:"
              if(Test-Path $nativeLog){ Get-Content $nativeLog -Tail 140 }
              throw "RoundUp did not create its own native WebView2 window"
            }
            if($p.MainWindowTitle -notmatch 'RoundUp'){
              Write-Host "Window title from runner: $($p.MainWindowTitle)"
              throw "No RoundUp native top-level window"
            }
            Write-Host "PASS: RoundUp native Windows window and embedded WebView2 opened, no Chrome needed"
            $html = (Invoke-WebRequest 'http://127.0.0.1:45672/' -UseBasicParsing).Content
            if ($html -notmatch '<title>RoundUp' -or $html -match '__RUNTIME_TOKEN__') {
              throw "Frontend branding or dynamic authentication broken"
            }
            $appJs = (Invoke-WebRequest 'http://127.0.0.1:45672/app.js' -UseBasicParsing).Content
            if ($appJs -notmatch 'RoundUpBridge') { throw "Legacy map UI not served" }
            $legacy = @(Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -match 'GeoZamir|ГеоЗамір' })
            Write-Host "Legacy browser windows still visible: $($legacy.Count)" 
            $body = '{"version":1,"shapes":[{"id":"smoke","points":[[49.8,24.1],[49.8,24.2],[49.9,24.2]]}],"cells":[]}'
            Invoke-RestMethod -Uri 'http://127.0.0.1:45672/roundup/coverage?project=smoke-test' -Method Put -Headers @{'X-RoundUp-Local'='1'} -Body $body -ContentType 'application/json' | Out-Null
            $saved = Invoke-RestMethod -Uri 'http://127.0.0.1:45672/roundup/coverage?project=smoke-test'
            if ($saved.shapes.Count -ne 1) { throw "Coverage data not saved" }
            Write-Host "PASS: RoundUp server, map UI, backend token and persistent coverage."
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            if (!$ready) {
              $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/roundup-host.log'
              if (Test-Path $log) { Get-Content $log -Tail 100 }
            }
          }
      - name: Verify frontend stays open and branded when backend fails
        shell: pwsh
        run: |
          $bundle = (Resolve-Path dist/app/GeoZamirCore.exe).Path
          $disabled = "$bundle.startup-test-disabled"
          Move-Item $bundle $disabled
          $exe = (Resolve-Path dist/app/RoundUp.exe).Path
          $p = $null
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
            $ok = $false
            for ($i=0; $i -lt 24; $i++) {
              Start-Sleep -Milliseconds 400
              $p.Refresh()
              if ($p.HasExited) { throw "RoundUp closed on backend failure, exit $($p.ExitCode)" }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:45672/roundup/status' -TimeoutSec 1
                $page = (Invoke-WebRequest 'http://127.0.0.1:45672/' -UseBasicParsing -TimeoutSec 1).Content
                if (!$status.ready -and $page -match 'Готуємо вашу карту') {
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (!$ok) { throw "RoundUp failed to display its own loading screen without legacy core" }
            Start-Sleep -Seconds 2
            $p.Refresh()
            if ($p.HasExited) { throw "RoundUp crashed after showing loading screen" }
            Write-Host "PASS: missing legacy backend cannot close RoundUp or show a fatal popup"
          }
          finally {
            if ($p -and !$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Move-Item $disabled $bundle -Force
          }
      - name: Compile and smoke-test launcher UI
        shell: pwsh
        run: |
          dotnet publish src/RoundUp.Launcher/RoundUp.Launcher.csproj -c Release -r win-x64 -o dist/launcher
          if ($LASTEXITCODE -ne 0) { throw "Launcher compilation failed" }
          $p = Start-Process -FilePath (Resolve-Path dist/launcher/RoundUpLauncher.exe).Path -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/launcher.log'
          $shown = $false
          try {
            for($i=0;$i -lt 25;$i++){
              Start-Sleep -Seconds 1
              if((Test-Path $log) -and ((Get-Content $log -Raw) -match 'ui-shown')){$shown=$true;break}
              if($p.HasExited){break}
            }
            if(!$shown){throw "Launcher UI did not open"}
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Compile one-click installer and smoke-test directories
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)) 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup unavailable" }
          }
          & $iscc '/DAppVersion=6.1.1' 'installer/RoundUp.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno installer failed" }
          $setup = (Resolve-Path dist/setup/RoundUpSetup-win-x64.exe).Path
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent installer exit code $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'RoundUp'
          foreach ($item in @('RoundUpLauncher.exe','app','projects','photos','imports','updates','backups/app','backups/projects','logs')) {
            if (!(Test-Path (Join-Path $root $item))) { throw "Missing installer folder $item" }
          }
      - name: Archive tested RoundUp release and compute update integrity hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/app/* -DestinationPath release/RoundUp-App-win-x64.zip -CompressionLevel Optimal
          $hash=(Get-FileHash release/RoundUp-App-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            version='v6.1.1'
            archive='RoundUp-App-win-x64.zip'
            executable='RoundUp.exe'
            sha256=$hash
          } | ConvertTo-Json | Set-Content release/roundup-update.json -Encoding utf8
          Copy-Item dist/launcher/RoundUpLauncher.exe release/RoundUpLauncher.exe
          Copy-Item dist/setup/RoundUpSetup-win-x64.exe release/RoundUpSetup-win-x64.exe
      - name: Upload Windows installer and program
        uses: actions/upload-artifact@v4
        with:
          name: RoundUp-Installer-and-App-win-x64
          path: release/
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub Release for launcher auto-updates
        if: contains(github.event.head_commit.message, '[publish]') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v6.1.1'
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/RoundUp-App-win-x64.zip release/roundup-update.json release/RoundUpLauncher.exe release/RoundUpSetup-win-x64.exe --clobber
          } else {
            gh release create $tag release/RoundUp-App-win-x64.zip release/roundup-update.json release/RoundUpLauncher.exe release/RoundUpSetup-win-x64.exe --title 'RoundUp 6.1.1 — Windows' --notes 'Одна шапка RoundUp без дубльованої Windows-панелі, повний екран карти, темний заголовок Windows. Лаунчер, проєкти, фотографії, геозони та бекапи залишилися без змін.' --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed" }
