name: Build RoundUp for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate RoundUp icon
        shell: pwsh
        run: |
          python scripts/build_icon.py
          if (!(Test-Path assets/RoundUp.ico)) { throw "Icon generation failed" }

      - name: Build self-contained GUI launcher
        shell: pwsh
        run: |
          dotnet publish src/RoundUp.Launcher/RoundUp.Launcher.csproj -c Release -r win-x64 -o dist/launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/launcher/RoundUpLauncher.exe)) { throw "Launcher exe missing" }

      - name: Smoke-test Windows GUI startup
        shell: pwsh
        run: |
          $launcher = (Resolve-Path dist/launcher/RoundUpLauncher.exe).Path
          $process = Start-Process -FilePath $launcher -PassThru
          $log = Join-Path $env:LOCALAPPDATA 'RoundUp/logs/launcher.log'
          $opened = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'ui-shown')) {
              $opened = $true
              break
            }
            if ($process.HasExited) { break }
          }
          $installed = Join-Path $env:LOCALAPPDATA 'RoundUp/RoundUpLauncher.exe'
          if ($opened) {
            for ($i = 0; $i -lt 20; $i++) {
              if ((Test-Path $installed) -and ((Get-Item $installed).Length -eq (Get-Item $launcher).Length)) { break }
              Start-Sleep -Seconds 1
            }
          }
          if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if ($opened -and (!(Test-Path $installed) -or (Get-Item $installed).Length -ne (Get-Item $launcher).Length)) {
            throw "Launcher did not finish installation copy."
          }
          if (!$opened) {
            if (Test-Path $log) { Get-Content $log }
            throw "RoundUp launcher GUI did not report opening within 30 seconds."
          }

      - name: Build modern Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (!$iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=0.1.0" "installer/RoundUp.iss"
          if ($LASTEXITCODE -ne 0) { throw "RoundUp installer build failed" }
          if (!(Test-Path dist/setup/RoundUpSetup-win-x64.exe)) { throw "RoundUp setup missing" }

      - name: Upload launcher build
        uses: actions/upload-artifact@v4
        with:
          name: RoundUpLauncher-win-x64
          path: dist/launcher/RoundUpLauncher.exe
          if-no-files-found: error

      - name: Upload one-click installer
        uses: actions/upload-artifact@v4
        with:
          name: RoundUpSetup-win-x64
          path: dist/setup/RoundUpSetup-win-x64.exe
          if-no-files-found: error

  preview:
    needs: launcher
    if: contains(github.event.head_commit.message, '[launcher-preview]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested launcher
        uses: actions/download-artifact@v4
        with:
          name: RoundUpLauncher-win-x64
          path: dist/launcher

      - name: Download tested setup installer
        uses: actions/download-artifact@v4
        with:
          name: RoundUpSetup-win-x64
          path: dist/setup

      - name: Publish public launcher preview (no interpreter)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.0.3-launcher-installer-preview"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/launcher/RoundUpLauncher.exe dist/setup/RoundUpSetup-win-x64.exe --clobber
          } else {
            gh release create $tag dist/launcher/RoundUpLauncher.exe dist/setup/RoundUpSetup-win-x64.exe --title "RoundUp Launcher + Setup · preview" --notes "Тестовий інсталятор та графічний лаунчер. Інтерпретатор RoundUp ще НЕ включено; не використовуйте як готову робочу версію." --prerelease --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {
              # A parallel preview workflow may have created the release in the meantime.
              gh release upload $tag dist/launcher/RoundUpLauncher.exe dist/setup/RoundUpSetup-win-x64.exe --clobber
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Preview release publication failed" }

  release:
    needs: launcher
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download launcher
        uses: actions/download-artifact@v4
        with:
          name: RoundUpLauncher-win-x64
          path: dist/launcher

      - name: Download tested setup installer
        uses: actions/download-artifact@v4
        with:
          name: RoundUpSetup-win-x64
          path: dist/setup

      - name: Package program and write SHA-256 manifest
        shell: pwsh
        run: |
          if (!(Test-Path app/RoundUp.exe)) {
            $legacyArchives = @(Get-ChildItem -File -Path . -Filter "GeoZamir*_Windows*.zip")
            if ($legacyArchives.Count -ne 1) {
              throw "Expected one clean legacy Windows ZIP or app/RoundUp.exe. Found $($legacyArchives.Count). No release published."
            }
            $legacyDir = Join-Path $env:RUNNER_TEMP "roundup-legacy"
            Expand-Archive -Path $legacyArchives[0].FullName -DestinationPath $legacyDir -Force
            $candidates = @(Get-ChildItem $legacyDir -File -Recurse -Filter "*.exe" |
              Where-Object { $_.Name -match "^GeoZamir.*[.]exe$" -and $_.Name -notmatch "Launcher" })
            if ($candidates.Count -ne 1) {
              throw "Expected exactly one GeoZamir program EXE; found $($candidates.Count)."
            }
            New-Item -ItemType Directory -Path app -Force | Out-Null
            Copy-Item $candidates[0].FullName app/RoundUp.exe
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path app/* -DestinationPath release/RoundUp-App-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release/RoundUp-App-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = "${{ github.ref_name }}"
            archive = "RoundUp-App-win-x64.zip"
            executable = "RoundUp.exe"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content release/roundup-update.json -Encoding utf8
          Copy-Item dist/launcher/RoundUpLauncher.exe release/RoundUpLauncher.exe
          Copy-Item dist/setup/RoundUpSetup-win-x64.exe release/RoundUpSetup-win-x64.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/RoundUp-App-win-x64.zip release/roundup-update.json release/RoundUpLauncher.exe release/RoundUpSetup-win-x64.exe --title "RoundUp ${{ github.ref_name }}" --generate-notes --verify-tag
